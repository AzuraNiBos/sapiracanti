<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Intro Aesthetic Final</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#cce7ff,#e0f7ff);
  overflow-x:hidden;
}

/* HERO */
.hero-img{
  width:180px;
  max-width:50vw;
  border-radius:25px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
  margin-bottom:20px;
  opacity:0;
  animation:fadeInUp 1s forwards;
}

/* TYPING CARD */
.quote-card{
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(8px);
  padding:14px 22px;
  border-radius:20px;
  box-shadow:0 6px 15px rgba(0,0,0,.1);
  font-size:14px;
  color:#1c3f66;
  max-width:260px;
  min-height:42px;
  margin-bottom:30px;
  opacity:0;
  transition:opacity .8s ease;
}

/* CURSOR */
.cursor{
  display:inline-block;
  margin-left:2px;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:0}
}

.next-btn{
  padding:10px 28px;
  background:linear-gradient(135deg,#89f7fe,#66a6ff);
  color:white;
  text-decoration:none;
  border-radius:25px;
  font-weight:500;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
  opacity:0;
  animation:fadeInUp 1s 1s forwards;
}

/* MUSIC */
.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  border:none;
  padding:10px 14px;
  border-radius:50%;
  background:#66a6ff;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}
.music-btn.playing{animation:spinGlow 2s linear infinite}

.music-progress{
  position:fixed;
  bottom:38px;
  right:85px;
  width:120px;
  height:6px;
  background:rgba(255,255,255,.4);
  border-radius:10px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(135deg,#ff9acb,#8fd3f4);
}

/* NAV */
.nav-container{
  position:fixed;
  top:20px;
  left:20px;
}
.nav-btn{
  background:linear-gradient(135deg,#ff9acb,#8fd3f4);
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:50px;
  cursor:pointer;
}
.nav-dropdown{
  display:none;
  flex-direction:column;
  margin-top:8px;
  background:rgba(255,255,255,.9);
  border-radius:12px;
  overflow:hidden;
}
.nav-dropdown a{
  padding:10px 16px;
  text-decoration:none;
  color:#1c3f66;
}

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes spinGlow{
  0%{transform:rotate(0)}
  100%{transform:rotate(360deg)}
}
</style>
</head>

<body>

<img src="image2/Screenshot_20250316_011714_Gallery.jpg" class="hero-img">

<div class="quote-card" id="quoteBox">
  <span id="typingText"></span><span class="cursor">|</span>
</div>

<a href="index2.html" class="next-btn" onclick="goNext(event)">Lanjut ➜</a>

<audio id="bgMusic" loop>
  <source src="music/The_improv_128k.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵</button>
<div class="music-progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="nav-container">
  <button class="nav-btn" onclick="toggleNav()">☰ Menu</button>
  <div class="nav-dropdown" id="navDropdown">
    <a href="index.html">Intro</a>
    <a href="index2.html">Perkenalan</a>
    <a href="gallery.html">Gallery</a>
  </div>
</div>

<script>
/* =====================
   TYPING FINAL (STABIL)
===================== */

const text = "Tetap sederhana, tetap bahagia."; // ✏️ GANTI DI SINI
const typingEl = document.getElementById("typingText");
const quoteBox = document.getElementById("quoteBox");
let i = 0;

window.addEventListener("load",()=>{
  typingEl.textContent="";
  i=0;

  // fade dulu
  setTimeout(()=>{
    quoteBox.style.opacity=1;
    setTimeout(typeText,600);
  },400);
});

function typeText(){
  if(i < text.length){
    typingEl.textContent += text.charAt(i);
    i++;
    setTimeout(typeText,80);
  }
}

/* =====================
   MUSIC (OPSIONAL)
===================== */

const music=document.getElementById("bgMusic");
const btn=document.querySelector(".music-btn");
const bar=document.getElementById("progressBar");
let playing=false;

function toggleMusic(){
  if(playing){
    music.pause();
    btn.classList.remove("playing");
  }else{
    music.play().catch(()=>{});
    btn.classList.add("playing");
  }
  playing=!playing;
}

music.addEventListener("timeupdate",()=>{
  bar.style.width=(music.currentTime/music.duration)*100+"%";
});

document.querySelector(".music-progress").onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  music.currentTime=((e.clientX-r.left)/r.width)*music.duration;
};

function goNext(e){
  e.preventDefault();
  const link=e.currentTarget.href;
  let fade=setInterval(()=>{
    if(!music.paused && music.volume>0.05){
      music.volume-=0.05;
    }else{
      clearInterval(fade);
      location.href=link;
    }
  },50);
}

function toggleNav(){
  const d=document.getElementById("navDropdown");
  d.style.display=d.style.display==="flex"?"none":"flex";
}
</script>

</body>
</html>
